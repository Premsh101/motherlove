version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: mothernest-backend
    restart: unless-stopped
    ports:
      - "5030:5030"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5030
    networks:
      - mothernest-net

  frontend:
    build: 
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: mothernest-frontend
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - mothernest-net
    depends_on:
      - backend

networks:
  mothernest-net:
    driver: bridge
