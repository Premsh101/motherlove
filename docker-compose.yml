version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: mothernest-backend
    restart: unless-stopped
    ports:
      - "5030:5030"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5030
      - FRONTEND_URL=${FRONTEND_URL}
      # Create/alter tables from src/models/schema.ts on every container start
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      # Create the sample accounts if they are missing (never overwrites data)
      - AUTO_SEED=${AUTO_SEED:-true}
      - MIGRATE_STRICT=${MIGRATE_STRICT:-false}
    volumes:
      # Uploaded documents live on disk — without this they are lost on rebuild
      - mothernest-uploads:/app/uploads
    networks:
      - mothernest-net

  frontend:
    build:
      context: ./frontend
      args:
        # The Next server proxies /api and /uploads to the backend over this
        # network, so the backend does not need to be publicly reachable.
        - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:5030}
        # Leave empty unless the browser should call the backend origin
        # directly instead of going through the proxy above.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: mothernest-frontend
    restart: unless-stopped
    ports:
      - "3030:3030"
    networks:
      - mothernest-net
    depends_on:
      - backend

networks:
  mothernest-net:
    driver: bridge

volumes:
  mothernest-uploads:
